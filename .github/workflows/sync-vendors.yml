name: Sync Vendor Skills

on:
  schedule:
    - cron: '0 20 * * *' # 每天 UTC 20:00 (北京时间 04:00)
  workflow_dispatch: # 手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Sync vendor skills
        run: pnpm start sync

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: sync vendor skills'
